[build]
  command = "npx vite build"
  publish = "dist"

# Run `npm run dev:netlify` from this directory so the Vite app and `/.netlify/functions/*` share one origin.
[dev]
  command = "npm run dev"
  targetPort = 5173

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
